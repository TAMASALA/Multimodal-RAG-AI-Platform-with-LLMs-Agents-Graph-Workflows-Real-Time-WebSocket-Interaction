version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: multimodal-rag-backend:latest
    container_name: multimodal-rag-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./storage:/app/storage
      - ./models:/app/models
    restart: unless-stopped
    networks:
      - rag-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: multimodal-rag-frontend:latest
    container_name: multimodal-rag-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
      - VITE_WS_BASE_URL=ws://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - rag-net

networks:
  rag-net:
    driver: bridge
